<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Multiplication Training</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --error-color: #f44336;
      --bg-color: #f0f8ff; /* AliceBlue */
      --text-color: #333;
    }
    
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    /* Screen management */
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    /* Buttons */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #45a049; }

    .home-btn {
      background-color: transparent;
      color: #666;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .home-btn:hover {
      background-color: #f1f1f1;
    }

    .header-actions {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 15px;
    }

    /* Start Screen - Digit Selectors */
    .digit-selectors {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .digit-selectors div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .digit-selectors label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 5px;
    }

    .digit-selectors span {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 15px;
    }

    input[type="number"] {
      width: 80px;
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* Play Screen */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #666;
    }
    
    .question-box {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 10px 0 20px 0;
      min-height: 60px;
    }

    .input-display {
      font-size: 2rem;
      min-height: 40px;
      margin-bottom: 10px;
      padding: 10px;
      border-bottom: 2px solid #ccc;
      letter-spacing: 2px;
    }

    /* Wrong Attempts Display */
    .wrong-attempts {
      min-height: 30px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }
    
    .wrong-badge {
      background-color: #ffebee;
      color: var(--error-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 1rem;
      text-decoration: line-through;
    }

    /* Animations */
    .correct {
      color: var(--primary-color);
      transform: scale(1.1);
      transition: all 0.2s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    .wrong {
      color: var(--error-color);
      animation: shake 0.3s ease-in-out;
    }

    /* Numpad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .numpad button {
      padding: 15px;
      font-size: 1.5rem;
      border: 1px solid #ddd;
      background: #f1f1f1;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .numpad button:active { background: #e0e0e0; }
    .numpad .clear-btn { background: #ffebee; color: var(--error-color); }
    .numpad .submit-btn { background: #e8f5e9; color: var(--primary-color); font-weight: bold; font-size: 1.2rem; }

    /* Result Screen */
    .result-list {
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 0;
      list-style: none;
    }
    .result-list li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
    .average-time {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-screen" class="screen active">
      <h1>Multiplication Training</h1>
      <p>Select the number of digits</p>
      
      <div class="digit-selectors">
        <div>
          <label for="level-input-1">Left</label>
          <input type="number" id="level-input-1" value="1" min="1" max="5">
        </div>
        <span>×</span>
        <div>
          <label for="level-input-2">Right</label>
          <input type="number" id="level-input-2" value="2" min="1" max="5">
        </div>
      </div>

      <button class="btn" onclick="startGame()">Start</button>
    </div>

    <div id="play-screen" class="screen">
      <div class="header-actions">
        <button class="home-btn" onclick="returnToTitle()">🏠 Home</button>
      </div>

      <div class="status-bar">
        <span id="question-counter">1 / 20</span>
        <span id="stopwatch">0.00 sec</span>
      </div>
      
      <div id="question-text" class="question-box"></div>
      <div id="user-input" class="input-display"></div>
      
      <div id="wrong-attempts" class="wrong-attempts"></div>

      <div class="numpad">
        <button onclick="inputNumber(7)">7</button>
        <button onclick="inputNumber(8)">8</button>
        <button onclick="inputNumber(9)">9</button>
        <button onclick="inputNumber(4)">4</button>
        <button onclick="inputNumber(5)">5</button>
        <button onclick="inputNumber(6)">6</button>
        <button onclick="inputNumber(1)">1</button>
        <button onclick="inputNumber(2)">2</button>
        <button onclick="inputNumber(3)">3</button>
        <button class="clear-btn" onclick="clearInput()">C</button>
        <button onclick="inputNumber(0)">0</button>
        <button class="submit-btn" onclick="checkAnswer()">Enter</button>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1>Results</h1>
      <div id="average-time" class="average-time"></div>
      <ul id="result-list" class="result-list"></ul>
      <button class="btn" onclick="returnToTitle()" style="margin-bottom: 10px;">🏠 Home</button>
      <button class="btn" onclick="startGame()" style="background-color: #2196F3;">Retry Same Level</button>
    </div>
  </div>

  <script>
    // State Variables
    const TOTAL_QUESTIONS = 20;
    let currentLevel1 = 1;
    let currentLevel2 = 2;
    let currentQuestionNum = 0;
    let currentAnswer = 0;
    let timeRecords = [];
    
    // "input" | "feedback" | "transition"
    let state = "input"; 
    
    // Timer Variables
    let startTime = 0;
    let timerInterval = null;

    // DOM Elements
    const screens = {
      start: document.getElementById('start-screen'),
      play: document.getElementById('play-screen'),
      result: document.getElementById('result-screen')
    };
    const ui = {
      levelInput1: document.getElementById('level-input-1'),
      levelInput2: document.getElementById('level-input-2'),
      counter: document.getElementById('question-counter'),
      stopwatch: document.getElementById('stopwatch'),
      questionText: document.getElementById('question-text'),
      userInput: document.getElementById('user-input'),
      wrongAttempts: document.getElementById('wrong-attempts'),
      resultList: document.getElementById('result-list'),
      averageTime: document.getElementById('average-time')
    };

    function showScreen(screenName) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[screenName].classList.add('active');
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startGame() {
      // 左右の桁数を取得
      currentLevel1 = Math.min(5, Math.max(1, parseInt(ui.levelInput1.value) || 1));
      currentLevel2 = Math.min(5, Math.max(1, parseInt(ui.levelInput2.value) || 1));
      ui.levelInput1.value = currentLevel1; 
      ui.levelInput2.value = currentLevel2;
      
      currentQuestionNum = 0;
      timeRecords = [];
      showScreen('play');
      nextQuestion();
    }

    function generateNumber(digits) {
      // 指定された桁数にぴったり合う数字を生成する（例: 2桁なら10〜99）
      const min = digits === 1 ? 1 : Math.pow(10, digits - 1);
      const max = Math.pow(10, digits) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nextQuestion() {
      if (currentQuestionNum >= TOTAL_QUESTIONS) {
        showResults();
        return;
      }

      currentQuestionNum++;
      ui.counter.textContent = `${currentQuestionNum} / ${TOTAL_QUESTIONS}`;
      ui.userInput.textContent = '';
      ui.wrongAttempts.innerHTML = '';
      ui.questionText.className = 'question-box'; 
      
      state = "input";

      // 左と右それぞれの指定桁数でランダムな数値を生成
      const num1 = generateNumber(currentLevel1);
      const num2 = generateNumber(currentLevel2);
      
      currentAnswer = num1 * num2;
      ui.questionText.textContent = `${num1} × ${num2}`;

      startTime = Date.now();
      stopTimer();
      timerInterval = setInterval(updateStopwatch, 10);
    }

    function updateStopwatch() {
      const elapsed = (Date.now() - startTime) / 1000;
      ui.stopwatch.textContent = `${elapsed.toFixed(2)} sec`;
    }

    function inputNumber(num) {
      if (state !== "input") return;
      // 5桁×5桁の最大文字数は10桁のため、制限を緩める
      if (ui.userInput.textContent.length >= 10) return; 
      
      ui.userInput.textContent += num;
      ui.questionText.className = 'question-box'; 
    }

    function clearInput() {
      if (state !== "input") return;
      ui.userInput.textContent = '';
      ui.questionText.className = 'question-box';
    }

    function checkAnswer() {
      if (state !== "input" || ui.userInput.textContent === '') return;

      const userAnswer = parseInt(ui.userInput.textContent, 10);
      
      if (userAnswer === currentAnswer) {
        state = "transition";
        stopTimer();
        
        const timeTaken = (Date.now() - startTime) / 1000;
        timeRecords.push({ q: ui.questionText.textContent, ans: currentAnswer, time: timeTaken });
        
        ui.questionText.classList.add('correct');
        ui.questionText.textContent = '⭕ Correct!';
        
        setTimeout(nextQuestion, 600);
      } else {
        state = "feedback";
        
        ui.questionText.classList.remove('wrong');
        void ui.questionText.offsetWidth; 
        ui.questionText.classList.add('wrong');
        
        const badge = document.createElement('span');
        badge.className = 'wrong-badge';
        badge.textContent = ui.userInput.textContent;
        ui.wrongAttempts.appendChild(badge);

        if (ui.wrongAttempts.children.length > 10) {
          ui.wrongAttempts.removeChild(ui.wrongAttempts.firstChild);
        }

        ui.userInput.textContent = ''; 
        state = "input";
      }
    }

    function showResults() {
      stopTimer();
      showScreen('result');
      
      ui.resultList.innerHTML = '';
      let totalTime = 0;

      timeRecords.forEach((record, index) => {
        totalTime += record.time;
        const li = document.createElement('li');
        li.innerHTML = `<span>Q${index + 1}. ${record.q}</span> <span>${record.time.toFixed(2)} sec</span>`;
        ui.resultList.appendChild(li);
      });

      const avgTime = timeRecords.length > 0 ? (totalTime / timeRecords.length) : 0;
      ui.averageTime.textContent = `Average Time: ${avgTime.toFixed(2)} sec`;
    }

    function returnToTitle() {
      stopTimer();
      state = "input"; 
      showScreen('start');
    }

    window.addEventListener('keydown', (e) => {
      if (!screens.play.classList.contains('active') || state !== "input") return;

      if (e.key >= '0' && e.key <= '9') {
        inputNumber(Number(e.key));
      } else if (e.key === 'Backspace') {
        ui.userInput.textContent = ui.userInput.textContent.slice(0, -1);
      } else if (e.key === 'Enter') {
        checkAnswer();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        clearInput();
      }
    });
  </script>
</body>
</html>
